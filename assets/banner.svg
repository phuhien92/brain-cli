<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="brain-banner-title brain-banner-description">
  <title id="brain-banner-title">brain-cli</title>
  <desc id="brain-banner-description">Headless memory for your markdown vault, for any agent, on any machine.</desc>
  <defs>
    <clipPath id="banner-corners">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-corners)">
    <rect width="1280" height="320" fill="#FFFFFF"/>
    <rect width="12" height="320" fill="#21C995"/>

    <!-- Linked Vault mark: the vault's wiki-link boundary and linked notes. -->
    <g transform="translate(64 80)">
      <rect width="128" height="128" rx="28" fill="#052F3E"/>
      <path d="M31 30H22V98H31 M41 30H32V98H41 M97 30H106V98H97 M87 30H96V98H87"
            fill="none" stroke="#DDF8EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 48L76 43L81 70L58 77L50 48 M58 77L66 90"
            fill="none" stroke="#21C995" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#FFFFFF">
        <circle cx="50" cy="48" r="7"/>
        <circle cx="76" cy="43" r="6"/>
        <circle cx="57.5" cy="76.5" r="6.5"/>
        <circle cx="81" cy="70" r="8" fill="#21C995"/>
        <circle cx="66" cy="90" r="5"/>
      </g>
    </g>

    <!-- Product name and durable positioning. -->
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="220" y="118" font-size="64" font-weight="750" fill="#14211D" letter-spacing="-2">brain<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="650" fill="#075E46" letter-spacing="-1">-cli</tspan></text>
      <text x="220" y="166" font-size="27" font-weight="650" fill="#14211D">Headless memory for your markdown vault.</text>
      <text x="220" y="202" font-size="19" fill="#4D6259">For any agent, on any machine.</text>
      <text x="220" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#075E46" letter-spacing="0.4">LOCAL-FIRST  ·  RANKED SEARCH  ·  ZERO RUNTIME DEPS</text>
    </g>

    <!-- Real product proof replaces the legacy decorative graph and feature pills. -->
    <g transform="translate(820 52)">
      <rect width="396" height="216" rx="18" fill="#052F3E"/>
      <circle cx="22" cy="22" r="5" fill="#21C995"/>
      <circle cx="40" cy="22" r="5" fill="#DDF8EE"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <text x="24" y="70" font-size="15" font-weight="600" fill="#FFFFFF">$ brain search &quot;deploy gotchas&quot;</text>
        <text x="24" y="112" font-size="13" fill="#DDF8EE">1  Projects/blog/runbook.md</text>
        <text x="24" y="143" font-size="13" fill="#DDF8EE">2  firstmate/learnings/…</text>
        <text x="24" y="184" font-size="12" font-weight="650" fill="#21C995">3 notes · fresh on read · local</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#D7E5DE"/>
</svg>
