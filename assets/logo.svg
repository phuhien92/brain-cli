<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">brain-cli logo</title>
  <desc id="d">Linked notes held inside double wiki-link brackets, on a green gradient that runs from deep to bright, with one amber focus note.</desc>
  <defs>
    <!-- design/tokens.json: color.actionText → color.successInk → color.brandGreenMid -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052F3E"/>
      <stop offset="0.55" stop-color="#075E46"/>
      <stop offset="1" stop-color="#108160"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#brand)"/>
  <!-- [[ ]]: the outer bracket in paper, the inner in action green -->
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 30H22V98H30 M98 30H106V98H98" stroke="#F4F8F6"/>
    <path d="M40 30H32V98H40 M88 30H96V98H88" stroke="#21C995"/>
  </g>
  <!-- linked notes -->
  <path d="M52 48L76 44L80 70L58 76Z M58 76L66 90" fill="none" stroke="#DDF8EE" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#F4F8F6">
    <circle cx="52" cy="48" r="7"/>
    <circle cx="76" cy="44" r="5.5"/>
    <circle cx="58" cy="76" r="6"/>
    <circle cx="66" cy="90" r="4.5"/>
    <circle cx="80" cy="70" r="8" fill="#FBBF24"/>
  </g>
</svg>
