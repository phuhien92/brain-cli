<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="brain-logo-title brain-logo-description">
  <title id="brain-logo-title">brain-cli logo</title>
  <desc id="brain-logo-description">A linked graph of notes held inside double wiki-link brackets.</desc>
  <!-- Bright local-first tokens: actionText field, brandSoft brackets, action signal. -->
  <rect width="128" height="128" rx="28" fill="#052F3E"/>
  <!-- [[ and ]]: a wiki-link holding the vault -->
  <path d="M31 30H22V98H31 M41 30H32V98H41 M97 30H106V98H97 M87 30H96V98H87"
        fill="none" stroke="#DDF8EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Linked notes; mint identifies the active connection without a separate status hue. -->
  <path d="M50 48L76 43L81 70L58 77L50 48 M58 77L66 90"
        fill="none" stroke="#21C995" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF">
    <circle cx="50" cy="48" r="7"/>
    <circle cx="76" cy="43" r="6"/>
    <circle cx="57.5" cy="76.5" r="6.5"/>
    <circle cx="81" cy="70" r="8" fill="#21C995"/>
    <circle cx="66" cy="90" r="5"/>
  </g>
</svg>
