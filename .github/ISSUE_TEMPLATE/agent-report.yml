name: Report from brain feedback
description: Filed with `brain feedback` by a person or an agent (redacted on the reporter's machine)
labels: ["agent-report"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer `brain feedback "<what happened>"` — it adds diagnostics and redacts your vault's paths and note titles.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [bug, idea, docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, or what you need
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: brain version, Node, OS, command and error code. Never paste note content.
      render: text
